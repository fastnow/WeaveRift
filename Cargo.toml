[package]
name = "FlashDllInjector"
version = "2.3.0"
edition = "2021"
authors = ["FastNow Studio <contact@fastnow.studio>"]
license = "Apache-2.0"
description = "High-performance Windows DLL injector with LoadLibraryW, Reflective and ManualMap support"
repository = "https://github.com/fastnow/FlashDllInjector"
publish = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
anyhow = "1.0"
sysinfo = "0.30"
rfd = "0.14"
inquire = "0.7"
chrono = "0.4"
thiserror = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"