[package]
name = "WeaveRift"
version = "1.0.4"
edition = "2021"
authors = ["FastNow Studio <contact@fastnow.studio>"]
license = "Apache-2.0"
description = "WeaveRift - dual-mode Minecraft injector (DLL + Java Agent)"
repository = "https://github.com/fastnow/WeaveRift"
publish = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_SystemInformation",
] }
winapi = { version = "0.3", features = ["tlhelp32", "libloaderapi", "winbase", "winnt"] }
anyhow = "1.0"
sysinfo = "0.30"
rfd = "0.14"
inquire = "0.7"
chrono = "0.4"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"