name: Auto Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RELEASE]')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            jar_loader -> target
            client -> target
          cache-on-failure: "true"

      - name: Read version.json metadata
        id: meta
        shell: pwsh
        run: |
          if (-not (Test-Path version.json)) { throw "version.json not found at repo root" }
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $ver = [string]$json.version
          if (-not $ver) { throw "version.json is missing required field: version" }
          Add-Content $env:GITHUB_OUTPUT "version=$ver"
          $title = [string]$json.title
          if (-not $title) { $title = "v$ver" }
          Add-Content $env:GITHUB_OUTPUT "title=$title"
          $desc = [string]$json.description
          Set-Content -Path RELEASE_BODY.md -Value $desc -Encoding UTF8
          $rel = [string]$json.release
          if ($rel -match '^(true|1|yes)$') {
            Add-Content $env:GITHUB_OUTPUT "release=true"
          } else {
            Add-Content $env:GITHUB_OUTPUT "release=false"
          }

      - name: Build WeaveRift.exe
        run: cargo build --release

      - name: Build weaverift-agent.jar
        working-directory: agent
        shell: cmd
        run: call build.bat < nul

      - name: Build jar_loader.dll
        working-directory: jar_loader
        run: cargo build --release

      - name: Build client.dll
        working-directory: client
        run: cargo build --release

      - name: Assemble release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release\WeaveRift | Out-Null

          Copy-Item target\release\WeaveRift.exe release\ -Force
          Copy-Item jar_loader\target\release\jar_loader.dll release\WeaveRift\ -Force
          Copy-Item client\target\release\client.dll release\WeaveRift\ -Force

          $jar = Get-ChildItem -Path agent\build -Filter 'weaverift-agent*.jar' -File |
                 Select-Object -First 1
          if (-not $jar) {
            throw "weaverift-agent*.jar not found under agent\build"
          }
          Copy-Item $jar.FullName release\WeaveRift\weaverift-agent.jar -Force

          if (Test-Path console.html) {
            Copy-Item console.html release\WeaveRift\ -Force
            Write-Host "console.html: from repo root"
          } elseif (Test-Path jar_loader\console.html) {
            Copy-Item jar_loader\console.html release\WeaveRift\ -Force
            Write-Host "console.html: from jar_loader/"
          } else {
            Write-Host "::warning::console.html not found, built-in fallback will be used"
          }

          if (Test-Path obf2srg.srg) {
            Copy-Item obf2srg.srg release\WeaveRift\ -Force
            Write-Host "obf2srg.srg: bundled"
          } else {
            Write-Host "::warning::obf2srg.srg not bundled - users must download it themselves"
          }

          Write-Host "=== release contents ==="
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'release\WeaveRift.exe',
            'release\WeaveRift\jar_loader.dll',
            'release\WeaveRift\client.dll',
            'release\WeaveRift\weaverift-agent.jar'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            throw "missing required artifacts: $($missing -join ', ')"
          }
          Write-Host "All required artifacts present."

      - name: Compress to release.zip
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath release.zip -Force
          Get-Item release.zip | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeaveRift-${{ steps.meta.outputs.version }}
          path: release.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.title }}
          body_path: RELEASE_BODY.md
          files: release.zip
          generate_release_notes: true
          fail_on_unmatched_files: true