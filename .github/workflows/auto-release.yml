name: Auto Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RELEASE]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            jar_loader -> target
          cache-on-failure: "true"

      - name: Read version.json metadata
        id: meta
        shell: pwsh
        run: |
          if (-not (Test-Path version.json)) { throw "version.json not found at repo root" }
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $ver = [string]$json.version
          if (-not $ver) { throw "version.json is missing required field: version" }
          Add-Content $env:GITHUB_OUTPUT "version=$ver"
          $title = [string]$json.title
          if (-not $title) { $title = "v$ver" }
          Add-Content $env:GITHUB_OUTPUT "title=$title"
          $desc = [string]$json.description
          Set-Content -Path RELEASE_BODY.md -Value $desc -Encoding UTF8
          $rel = [string]$json.release
          if ($rel -match '^(true|1|yes)$') {
            Add-Content $env:GITHUB_OUTPUT "release=true"
          } else {
            Add-Content $env:GITHUB_OUTPUT "release=false"
          }

      - name: Build WeaveRift.exe
        run: cargo build --release

      - name: Build jar_loader.dll
        working-directory: jar_loader
        run: cargo build --release

      - name: Build weaverift-agent.jar
        working-directory: agent
        shell: cmd
        run: build.bat

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\WeaveRift | Out-Null
          Copy-Item target\release\WeaveRift.exe release\ -Force
          Copy-Item jar_loader\target\release\jar_loader.dll release\WeaveRift\ -Force
          Copy-Item agent\build\weaverift-agent-1.0.0.jar release\WeaveRift\ -Force
          Write-Host "=== release contents ==="
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Compress to release.zip
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath release.zip -Force
          Get-Item release.zip | Select-Object FullName, Length

      - name: Create GitHub Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.title }}
          body_path: RELEASE_BODY.md
          files: release.zip
          generate_release_notes: true
          fail_on_unmatched_files: true