[package]
name = "jar_loader"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
minhook = "0.9.0"
jni = "0.21"
tiny_http = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true